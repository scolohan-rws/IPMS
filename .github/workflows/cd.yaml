name: Deploy

on:
  release:
    types:
      - published

jobs:
  deploy:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    environment: ${{ github.event.release.prerelease == true && 'dev' || 'prod' }}
    concurrency:
      group: deploy-${{ github.event.release.prerelease && 'dev' || 'prod' }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ github.event.release.prerelease == true && 'dev' || 'prod' }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      BUILD_VERSION: ${{ github.event.release.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ACCESS_ROLE }}
          role-session-name: ipms-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Deploy
        run: npx sst deploy --stage "$ENVIRONMENT"
